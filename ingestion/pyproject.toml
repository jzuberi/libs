[project]
name = "ingestion"
version = "0.1.0"
description = "Internal ingestion framework"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.uv.workspace]
members = ["libs/ingestion"]
